name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AquaFit.apk
          jq -n \
            --argjson code "$BUILD_NUMBER" \
            --arg name "1.2.$BUILD_NUMBER" \
            --arg notes "$COMMIT_MESSAGE" \
            '{versionCode: $code, versionName: $name, notes: $notes}' > version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AquaFit.apk version.json --title "Aqua Fit 1.2.$BUILD_NUMBER" --notes "Build automático do último commit na main."
